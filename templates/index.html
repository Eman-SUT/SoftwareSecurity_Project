{% extends "base.html" %}
{% block content %}
<h2>Products</h2>
<div class="grid">
  {% for p in products %}
  <div class="card">
    <h3><a href="{{ url_for('product', pid=p['id']) }}">{{ p['name'] }}</a></h3>
    <p>{{ p['description'] }}</p>
    <b>${{ p['price'] }}</b>
  </div>
  {% endfor %}
</div>
{% endblock %}
