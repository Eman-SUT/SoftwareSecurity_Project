<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureShop</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
    nav { background: #1f3a5f; padding: 12px 16px; display: flex; gap: 16px; flex-wrap: wrap; }
    nav a { color: white; text-decoration: none; font-weight: bold; }
    main { max-width: 900px; margin: 20px auto; padding: 0 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .card { background: white; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    input { width: 100%; padding: 8px; margin: 4px 0 10px; box-sizing: border-box; }
    .btn { background: #1f3a5f; color: white; border: 0; padding: 8px 14px; border-radius: 5px; cursor: pointer; }
    .flash { padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    .flash.ok { background: #d4edda; }
    .flash.error { background: #f8d7da; }
  </style>
</head>
<body>
  <nav>
    <a href="/">SecureShop</a>
    {% if session.get('uid') %}
      <a href="/logout">Logout ({{ session['username'] }})</a>
    {% else %}
      <a href="/login">Login</a>
      <a href="/register">Register</a>
    {% endif %}
  </nav>
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}
        <div class="flash {{ cat }}">{{ m }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
